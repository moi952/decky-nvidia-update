name: Build, Bump & Release Decky Plugin

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  generate-changelog:
    uses: ./.github/workflows/changelog.yml

  release:
    runs-on: ubuntu-latest
    needs: generate-changelog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vendor decky-plugin-toolkit
        run: |
          set -e
          pip3 install --target py_modules --no-deps --upgrade \
            "git+https://github.com/moi952/decky-plugin-toolkit.git@v0.1.0"
          find py_modules -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Check standalone controller
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest discover -s tests -v
          sudo env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m unittest discover -s tests -p test_cache.py -v
          for script in bin/steamos-nvidia-update.sh bin/standalone/*.sh; do bash -n "$script"; done

      - name: Check frontend
        run: |
          pnpm exec tsc --noEmit
          node tests/driver_dropdown.cjs
          node tests/dropdown_geometry.cjs
          node tests/plugin_updates.cjs
          node tests/driver_operation.cjs

      - name: Setup Git user
        run: |
          git config user.name "Decky CI"
          git config user.email "ci@decky.app"

      - name: Decode changelog
        run: |
          mkdir -p artifact
          echo "${{ needs.generate-changelog.outputs.changelog }}" | base64 -d > artifact/release_notes.md
          cat artifact/release_notes.md

      - name: Bump version and create git tag
        run: |
          set -e
          node scripts/configure-release.mjs "$GITHUB_REPOSITORY"
          git add project.config.json src/project.config.json
          pnpm version ${{ github.event.inputs.bump }} --message "chore(release): v%s" --no-git-checks
          git push origin HEAD --follow-tags

      - name: Build plugin
        run: |
          set -e
          pnpm build

      - name: Create plugin zip
        run: |
          set -e
          PLUGIN_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifact/$PLUGIN_NAME
          cp -r dist artifact/$PLUGIN_NAME/
          cp main.py plugin.json package.json project.config.json artifact/$PLUGIN_NAME/
          cp -r py_modules artifact/$PLUGIN_NAME/
          cp -r bin artifact/$PLUGIN_NAME/
          cp LICENSE* README* artifact/$PLUGIN_NAME/ || true
          pushd artifact
          zip -r "$PLUGIN_NAME-v$VERSION.zip" "$PLUGIN_NAME"
          popd

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PLUGIN_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            artifact/"$PLUGIN_NAME-v$VERSION.zip" \
            --title "v$VERSION" \
            --notes-file artifact/release_notes.md \
            --draft=false \
            --prerelease=false
